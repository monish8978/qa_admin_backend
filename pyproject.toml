[project]
name = "qa-api-py"
version = "0.1.0"
description = "Python (FastAPI) port of the QA Platform API. Side-by-side with apps/api (NestJS)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.1.3,<5",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "email-validator>=2.2.0",
  "redis>=5.0.7",
  "celery>=5.4.0",
  "cuid2>=2.0.1",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "structlog>=24.2.0",
  "cryptography>=42.0.0",
  "stripe>=10.0.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-passlib",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
